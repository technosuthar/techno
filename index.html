    <title>Menu Button</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* Navbar */
        .navbar {
            background-color: #333;
            overflow: hidden;
            padding: 10px;
        }

        /* Menu Button */
        .menu-btn {
            background-color: #333;
            color: white;
            border: none;
            font-size: 18px;
            cursor: pointer;
        }

        /* Dropdown content */
        .dropdown {
            display: none;
            position: absolute;
            background-color: #444;
            min-width: 150px;
            border-radius: 5px;
        }

        .dropdown a {
            display: block;
            color: white;
            padding: 10px;
            text-decoration: none;
        }

        .dropdown a:hover {
            background-color: #555;
        }

        .show {
            display: block;
        }
    </style>
</head>
<body>

<div class="navbar">
    <button class="menu-btn" onclick="toggleMenu()">☰ Menu</button>
    <div class="dropdown" id="dropdownMenu">
        <a href="app.html">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="ff.html">sign up</a>
        <a href="users.html">Users</a>
    </div>
</div>

<script>
function toggleMenu() {
    document.getElementById("dropdownMenu").classList.toggle("show");
}
</script>

    <title>Techno Store</title>
    <style>
        body {

            margin-top: 0;
        }

            border-radius: 4px;

        }

            font-weight: bold;

</head>
<body>

<header>  <img src="Unknown.jpeg"  width="40" height="40"> Techno Store</header>

    <div class="cart">
        <h2> Techno Cart</h2>
        <div id="cartItems"></div>
        <div class="total">Total: <span id="total">0.0</span></div>
        <input type="text" id="customerName" placeholder="Enter Your Name!" style="width:100%; padding:8px; margin-top:10px;">
<button onclick="buyNow()" style="margin-top:10px; width:100%; background:#000000; color:white; border:none; padding:10px; border-radius:10px; cursor:pointer;">
    Buy now!
</button>

<div id="message" style="margin-top:10px; color:green; font-weight:bold;"></div>

    </div>
</div>

<script>
    let cart = [];
    let total = 0;

    function addToCart(product, price) {
        cart.push({product, price});
        total += price;
        updateCart();
    }

    function removeFromCart(index) {
        total -= cart[index].price;
        cart.splice(index, 1);
        updateCart();
    }

    function updateCart() {
        let cartItems = document.getElementById("cartItems");
        cartItems.innerHTML = "";

        cart.forEach((item, index) => {
            cartItems.innerHTML += `
                <div class="cart-item">
                    ${item.product} - ${item.price}
                    <button class="remove-btn" onclick="removeFromCart(${index})">X</button>
                </div>
            `;
        });

        document.getElementById("total").innerText = total;
    }
</script>
<script>
function buyNow() {
    let name = document.getElementById("customerName").value;

    if (cart.length === 0) {
        alert("Techno cart is empty!");
        return;
    }

    if (name === "") {
        alert("Please enter your name in techno cart!");
        return;
    }

    let upiID = "9462686765@okbizaxis";  // 🔴 Replace with your UPI ID
    let amount = total;
    let note = "Shopping Payment";

    let upiLink = `upi://pay?pa=${upiID}&pn=${name}&am=${amount}&cu=INR&tn=${note}`;

    window.location.href = upiLink;
    
}
</script>
